name: stage-chatgpt-logo
on:
  push:
    branches: [chore/chatgpt-logo]
    paths:
      - .github/workflows/stage-chatgpt-logo.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/chatgpt-logo
      - name: Apply binary logo patch
        shell: bash
        run: |
          git apply --binary .github/logo-chatgpt.patch
          test "$(wc -c < assets/logo-chatgpt.png)" -lt 10000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-chatgpt.png
          git diff --cached --quiet || git commit -m "Add ChatGPT-compatible logo"
          git push
