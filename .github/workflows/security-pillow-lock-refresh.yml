name: Temporary Pillow lock refresh

on:
  push:
    branches: [security/pillow-13-0-0]
    paths:
      - pyproject.toml
      - .github/workflows/security-pillow-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Regenerate Pillow lock only
        run: |
          set -euo pipefail
          uv lock --upgrade-package pillow
          uv lock --check
          uv sync --dev --locked
      - name: Check patched versions and run image regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path
          import certifi
          import PIL
          lock = tomllib.loads(Path("uv.lock").read_text())
          pkgs = {p["name"]: p["version"] for p in lock["package"]}
          assert pkgs["pillow"] == "13.0.0", pkgs["pillow"]
          from packaging.version import Version
          assert Version(pkgs["certifi"]) >= Version("2026.10.19")
          assert PIL.__version__ == "13.0.0", PIL.__version__
          print("Patched Pillow and certifi locked and installed")
          PY
          uv run pytest -q
      - name: Commit regenerated lockfile to security branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "No lockfile change produced"
            exit 1
          fi
          git commit -m "chore(lock): resolve patched Pillow 13.0.0"
          git push origin HEAD:security/pillow-13-0-0
