name: Temporary google-auth uv.lock refresh
on:
  push:
    branches:
      - maintenance/google-auth-2.62.1-lock-20261103
    paths:
      - .github/workflows/temp-google-auth-lock-refresh.yml
      - pyproject.toml
      - uv.lock
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/maintenance/google-auth-2.62.1-lock-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Resolve only the reviewed google-auth version
        run: |
          set -euo pipefail
          uv lock --upgrade-package google-auth==2.62.1
          uv sync --dev --locked
          uv run python -c 'import importlib.metadata as m; assert m.version("google-auth") == "2.62.1"'
          uv run pytest -q
      - name: Push generated lockfile for review
        run: |
          set -euo pipefail
          git add -- uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(deps): regenerate google-auth 2.62.1 lock'
            git push origin HEAD:refs/heads/maintenance/google-auth-2.62.1-lock-20261103
          fi
