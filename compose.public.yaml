# ChatGPT access: shared Cloudflare Tunnel -> gateway (Access JWT + tool allowlist) -> gdrive MCP server on the host
# (python -m gdrive_mcp.server --http 8766, bound to 127.0.0.1). No host port is published.
# Run: docker compose -f compose.public.yaml up -d
name: gdrive-public
services:
  gateway:
    image: node:26.10.0-alpine
    container_name: gdrive-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file: public/gateway.env
    environment:
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "8766"
      UPSTREAM_PATH: /mcp
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./public/gateway:/app:ro
    networks:
      edge:
        aliases:
          - drive-gateway
    read_only: true
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  edge:
    driver: bridge
