[project]
name = "gdrive-mcp"
version = "0.1.0"
description = "Own MCP server for Google Drive, Docs and Sheets, fenced to allowed folders"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-auth[requests]>=2.30",
    "google-auth-oauthlib>=1.2",
    "mcp>=2.2.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
