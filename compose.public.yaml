# ChatGPT access: Cloudflare Tunnel -> gateway (Access JWT + tool allowlist) -> gdrive MCP server on the host
# (python -m gdrive_mcp.server --http 8766, bound to 127.0.0.1). No host port is published.
# Run: docker compose -f compose.public.yaml up -d      Kill switch: docker stop gdrive-cloudflared
name: gdrive-public
services:
  gateway:
    image: node:24.21.0-alpine
    container_name: gdrive-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file: public/gateway.env
    environment:
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "8766"
      UPSTREAM_PATH: /mcp
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./public/gateway:/app:ro
    networks: [edge]
    read_only: true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: gdrive-cloudflared
    # Remotely managed tunnel: configure your own public hostname -> http://gateway:8080 in the
    # Cloudflare dashboard; TUNNEL_TOKEN comes from public/tunnel.env.
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: public/tunnel.env
    networks: [edge]
    depends_on: [gateway]
    restart: unless-stopped

networks:
  edge:
    driver: bridge
