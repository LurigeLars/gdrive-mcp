# ChatGPT access: shared Cloudflare Tunnel -> gateway (Access JWT + tool allowlist) -> gdrive MCP server on the host
# (python -m gdrive_mcp.server --http 8766, bound to 127.0.0.1). No host port is published.
# Run: docker compose -f compose.public.yaml up -d      Kill switch: docker stop gdrive-cloudflared
name: gdrive-public
services:
  gateway:
    image: node:26.9.0-alpine
    container_name: gdrive-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file: public/gateway.env
    environment:
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "8766"
      UPSTREAM_PATH: /mcp
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./public/gateway:/app:ro
    networks: [edge]
    read_only: true
    restart: unless-stopped

networks:
  edge:
    driver: bridge
