name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  gateway-node26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate gateway on Node 26
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:26.9.0-alpine node --check public/gateway/gateway.mjs
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:26.9.0-alpine node --check public/gateway/policy.mjs
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:26.9.0-alpine node --test public/gateway/policy.test.mjs
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:26.9.0-alpine node public/access-test.mjs file:///repo/public/gateway/gateway.mjs
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --dev --locked
      - run: uv run pytest -q
