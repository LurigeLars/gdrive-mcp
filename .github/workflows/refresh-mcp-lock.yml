name: Refresh MCP lock

on:
  push:
    branches:
      - deps/mcp-2.3.0-watch

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: deps/mcp-2.3.0-watch
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Refresh MCP lock
        run: uv lock --upgrade-package mcp
      - name: Verify MCP lock
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = {
              p["name"]: p["version"]
              for p in lock["package"]
              if "version" in p
          }
          assert versions["mcp"] == "2.3.0", versions["mcp"]
          PY
      - name: Validate and test
        run: |
          python -m py_compile scripts/upstream_watch_mcp.py
          uv sync --dev --locked
          uv run pytest -q
      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-mcp-lock.yml
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "deps: refresh lock for MCP Python SDK 2.3.0"
          git push origin HEAD:deps/mcp-2.3.0-watch
